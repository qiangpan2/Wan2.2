[build-system]
requires = [
    "setuptools>=61.0",
    "amdsmi @ file:///opt/rocm-7.1.0/share/amd_smi"
]
build-backend = "setuptools.build_meta"

[project]
name = "wan"
version = "2.2.0"
description = "Wan: Open and Advanced Large-Scale Video Generative Models"
authors = [
    { name = "Wan Team", email = "wan.ai@alibabacloud.com" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"

requires-python = "==3.12.3"
dependencies = [
    "torch @ file:///torch-2.9.1%2Brocm7.1.0.lw.git351ff442-cp312-cp312-linux_x86_64.whl#sha256=bff09fce55656db5954b7b79b007994d8421c9ef718e5681f686951af8b2a7ad",
    "flash_attn @ file:///root/flash_attn-2.8.3-py3-none-any.whl",
    "triton @ file:///triton-3.5.1%2Brocm7.1.0.gita272dfa8-cp312-cp312-linux_x86_64.whl#sha256=ca50f1cbe8a92fb9976959c7d8ad4d60ec701d452cd4035b27db3153e19ef5f1",
    "torchaudio @ file:///torchaudio-2.9.0%2Brocm7.1.0.gite3c6ee2b-cp312-cp312-linux_x86_64.whl#sha256=a5199a0ed3329b0a3ca24b21fd9dfb1e4366f89022a30cd4c78b6d4c797db948",
    "torchvision @ file:///torchvision-0.24.0%2Brocm7.1.0.gitb919bd0c-cp312-cp312-linux_x86_64.whl#sha256=de56228db2e2d1bad12d59e0f3f2caaee459413f6a7d47ca839ab4b3b1aa0e28",
    "opencv-python>=4.9.0.80",
    "diffusers>=0.31.0",
    "transformers>=4.49.0",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio",
    "easydict",
    "ftfy",
    "dashscope",
    "imageio-ffmpeg",
    "numpy>=1.23.5,<2",
    "decord",
    "librosa",
    "peft"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
    "mypy",
    "huggingface-hub[cli]"
]
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[project.urls]
homepage = "https://wanxai.com"
documentation = "https://github.com/Wan-Video/Wan2.2"
repository = "https://github.com/Wan-Video/Wan2.2"
huggingface = "https://huggingface.co/Wan-AI/"
modelscope = "https://modelscope.cn/organization/Wan-AI"
discord = "https://discord.gg/p5XbdQV7"

[tool.setuptools]
packages = ["wan"]

[tool.setuptools.package-data]
"wan" = ["**/*.py"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
strict = true


